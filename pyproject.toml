description = "Sustav za detekciju bolesti i preporuku njege biljaka (završni rad, FIPU)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=13",
    "imagehash>=4.3",
    "numpy>=2.0",
    "pandas>=3",
    "tqdm>=4.66",
    "torch>=2.4",
    "torchvision>=0.19",
    "scikit-learn>=1.5",
    "matplotlib==3.10.*",
    "anthropic>=2.14.0",
]
